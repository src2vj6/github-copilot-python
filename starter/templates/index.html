<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="theme-toggle-container">
    <button id="dark-mode-toggle" class="dark-mode-toggle" title="Toggle Dark Mode" aria-label="Toggle Dark Mode">
      <span class="toggle-icon">🌙</span>
    </button>
  </div>
  <h1>Sudoku Game</h1>
  <div class="difficulty-selector">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>
  <div class="timer-display">
    <span>Time: </span>
    <span id="timer">00:00</span>
  </div>
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="get-hint">Get Hint</button>
    <span id="hints-counter">Hints: 0</span>
    <span id="message"></span>
  </div>
  <div id="name-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h2>You solved it!</h2>
      <p>Time: <span id="modal-time"></span></p>
      <p>Hints used: <span id="modal-hints"></span></p>
      <p>Difficulty: <span id="modal-difficulty"></span></p>
      <input type="text" id="player-name" placeholder="Enter your name" maxlength="50">
      <button id="submit-score">Submit Score</button>
    </div>
  </div>
  <div class="top-scores-section">
    <h2>Top 10 Scores</h2>
    <table id="top-scores-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Time</th>
          <th>Hints</th>
          <th>Difficulty</th>
        </tr>
      </thead>
      <tbody id="scores-tbody">
        <tr><td colspan="5">No scores yet</td></tr>
      </tbody>
    </table>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
